<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To-Do List</title>
    <!-- Link to our stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="container">

      <h1>My To-Do List</h1>

      <!-- Input area: text box + button -->
      <div class="input-area">
        <input
          type="text"
          id="task-input"
          placeholder="Enter a new task..."
          aria-label="New task"
        />
        <button id="add-btn">Add Task</button>
      </div>

      <!-- Error message shown when the input is empty -->
      <p id="error-msg" class="error hidden">Please enter a task before adding.</p>

      <!-- The list of tasks will appear here -->
      <ul id="task-list"></ul>

    </div>

    <!-- Link to our JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
